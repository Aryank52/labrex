[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labrex-backend"
version = "0.1.0"
description = "LABREX Labour Market Intelligence & Policy Optimization Backend"
authors = [{ name = "LABREX Engineering Team" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
    "httpx>=0.27.0",
    "reportlab>=4.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
