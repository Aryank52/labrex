# LABREX Data Acquisition Manifest: NCO-2015
manifest_version: "2.0.0"
source_id: "SRC-NCO-2015"
dataset_name: "National Classification of Occupations 2015"
authority: "Ministry of Labour & Employment (MoLE), Directorate General of Employment (DGE)"
dataset_type: "REAL"
official_url: "https://labour.gov.in/national-classification-occupations-nco"
alternate_url: "https://dge.gov.in/dge/nco"
retrieval_date: "2026-10-20"
publication_version: "NCO-2015-Standard"
expected_format: "CSV"
alternate_formats:
  - "XLSX"
  - "PDF"
acquisition_targets:
  volume_2b:
    title: "Volume II-B: Occupational Descriptions & Task Definitions"
    description: "Detailed job descriptions, main duties, tasks, and educational requirements"
    filename_patterns:
      - "*volume_2b*"
      - "*volume2b*"
      - "*vol_2b*"
      - "*vol2b*"
      - "*vol_ii_b*"
      - "*vol_ii-b*"
      - "*descriptions*"
    expected_type: "OCCUPATIONAL_DESCRIPTIONS"
  volume_2a:
    title: "Volume II-A: Occupational Descriptions"
    description: "Occupational Descriptions Division 0 to 4"
    filename_patterns:
      - "*volume_2a*"
      - "*volume2a*"
      - "*vol_2a*"
      - "*vol2a*"
      - "*vol_ii_a*"
      - "*vol_ii-a*"
    expected_type: "OCCUPATIONAL_DESCRIPTIONS"
  volume_1:
    title: "Volume I: Code Structure & Hierarchy"
    description: "Contains Division (1-digit), Sub-Division (2-digit), Group (3-digit), Family (4-digit), and Occupation (8-digit) codes"
    filename_patterns:
      - "*volume_1*"
      - "*volume1*"
      - "*vol_1*"
      - "*vol1*"
      - "*vol_i.*"
      - "*vol_i_*"
      - "*code_structure*"
    expected_type: "TAXONOMY_HIERARCHY"
parser: "backend.app.services.data.parsers.nco_parser.NCOParser"
parser_version: "1.0.0"
destination:
  bronze_table: "stg_raw_nco_codes"
  silver_table: "clean_nco_taxonomy"
  gold_dimension: "dim_occupation"
geographic_granularity: "NATIONAL"
temporal_granularity: "STATIC_STANDARD"
pii_level: "NONE"
field_mappings:
  division_code: "division"
  sub_division_code: "sub_division"
  group_code: "group"
  family_code: "family"
  occupation_code: "nco_code"
  occupation_title: "title"
  description: "description"
  mapped_sector: "sector"
validation_rules:
  - "nco_code_format_regex: ^[0-9]{4}\\.[0-9]{2,4}$"
  - "non_empty_title: true"
  - "division_range: 0-9"
max_file_size_bytes: 52428800 # 50 MB
